<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBSCURE ANONYMOUS</title>
<style>body{background:#000;color:#fff;text-align:center;font-family:Arial;padding:20px}h1{color:#ec4899;font-size:40px}.card{background:#111827;padding:20px;border-radius:15px;max-width:400px;margin:auto}input,textarea{width:100%;padding:13px;margin:10px 0;border-radius:10px;border:1px solid #444;background:#000;color:#fff}button{width:100%;padding:14px;border:none;border-radius:999px;background:#ec4899;color:#fff;font-weight:bold}#link{word-break:break-all;background:#000;padding:10px;border:1px dashed #a855f7;border-radius:10px;display:none}</style>
</head><body>
<h1>OBSCURE</h1><p>ANONYMOUS</p><p>Send anonymous messages. No one will know.</p>
<div class="card" id="c1">
<h3>Get Your OBSCURE Link</h3>
<input id="u" placeholder="Enter username e.g darkloner">
<button onclick="go()">Create My Link</button>
<div id="link"></div>
<button onclick="copyL()" style="background:green;margin-top:10px">Copy My Link</button>
</div>
<div class="card" id="c2" style="display:none">
<h3 id="t">Send Anonymous Message</h3>
<textarea id="m" placeholder="Type message..."></textarea>
<button onclick="send()">Send Anonymously</button>
<p id="ok" style="display:none;color:lime">Message sent!</p>
</div>
<script>
var link="";
function go(){var u=document.getElementById('u').value.trim().toLowerCase();if(!u){alert('Enter username');return}link=location.origin+location.pathname+'?u='+u;var d=document.getElementById('link');d.style.display='block';d.innerText=link;alert('Link ready! Press Copy My Link');}
function copyL(){if(!link)return;navigator.clipboard.writeText(link);alert('Copied!');}
var p=new URLSearchParams(location.search).get('u');
if(p){document.getElementById('c1').style.display='none';document.getElementById('c2').style.display='block';document.getElementById('t').innerText='Send to @'+p;}
function send(){var t=document.getElementById('m').value;if(!t){alert('Type message');return}document.getElementById('m').value='';document.getElementById('ok').style.display='block';}
</script></body></html>
